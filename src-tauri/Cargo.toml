[package]
name = "erx-tools"
version = "0.1.0"
description = "ERX Tools for Windows - a lightweight offline toolbox"
authors = ["EhsanKarimiRX"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "erx_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# System Manager / Awake: state file (awake_state.json) serialization.
# Already in the lockfile via Tauri; also used by DTO shape tests.
serde_json = "1"
# Image Converter: decoding/encoding. The `ico` feature (Folder Icon) only
# enables bmp+png code paths that are already on — it adds the ICO container
# encoder plus the independent decoder used by the read-back tests.
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp", "ico"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
# System Manager / Awake: best-effort native Windows notifications when
# Awake switches itself off. Local toast only; used from Rust commands, so
# the webview needs no notification permission.
tauri-plugin-notification = "2"
# QR Code Generator: QR matrix generation (pure Rust, zero dependencies).
qrcodegen = "1.8"
# QR Code Generator: PNG rasterization of the shared QR geometry (pure Rust).
# Folder Icon: rasterizes the shared folder geometry into .ico frames.
tiny-skia = "0.12"
# QR Code Generator: embedding the logo PNG into the SVG as a data URL.
# Folder Icon: PNG data URLs for the small previews.
base64 = "0.22"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_System_Power", "Win32_System_Registry", "Win32_Security", "Win32_System_SystemInformation"] }

[dev-dependencies]
# QR read-back tests only — never ships in the app binary.
rqrr = "0.11"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
