[package]
name = "erx-tools"
version = "0.1.0"
description = "ERX Tools for Windows - a lightweight offline toolbox"
authors = ["EhsanKarimiRX"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "erx_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
# QR Code Generator: QR matrix generation (pure Rust, zero dependencies).
qrcodegen = "1.8"

[dev-dependencies]
# QR read-back tests only — never ships in the app binary.
rqrr = "0.11"
# DTO shape tests only (already in the lockfile via Tauri).
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
